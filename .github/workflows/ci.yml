name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # placeholders: the shell doesn't contact Supabase in tests
  VITE_SUPABASE_URL: https://placeholder.supabase.co
  VITE_SUPABASE_ANON_KEY: placeholder-anon-key

# Browser installs pull system packages from apt, which can hang: a time limit per attempt,
# one retry, and a limit per job, so a stuck run fails fast instead of blocking for half an hour.
# The three jobs run side by side.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm coverage

  # Pull requests: the smoke tests only (the journeys need the dev project's keys)
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install WebKit
        timeout-minutes: 11
        run: for attempt in 1 2; do timeout 300 pnpm exec playwright install --with-deps webkit && break; done
      - run: pnpm e2e

  # Schema + RLS integration tests against the DEV Supabase project (never prod)
  # Uses the dev service-role key: only on pushes to main, never for pull requests
  db-tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: db-tests-dev-project
      cancel-in-progress: false
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
    steps:
      - name: Require dev project secrets
        run: |
          for name in SUPABASE_TEST_URL SUPABASE_TEST_ANON_KEY SUPABASE_TEST_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (dev project credentials, see .env.test.local)"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  # The smoke tests and the real user journeys (WebKit/iPhone, offline restart in Chromium)
  # against the DEV project; side by side with the checks, sharing one browser install
  e2e-journeys:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: e2e-journeys-dev-project
      cancel-in-progress: false
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      # the app under test talks to the dev project
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install WebKit and Chromium
        timeout-minutes: 11
        run: for attempt in 1 2; do timeout 300 pnpm exec playwright install --with-deps webkit chromium && break; done
      - run: pnpm exec playwright test --project=smoke --project=journeys-webkit --project=journeys-chromium
