<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CALculator</title>
    <meta name="description" content="Household meal and nutrition tracker" />

    <!-- iOS standalone PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CALculator" />
    <meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)" />

    <!-- start in the account's look (mirrored to localStorage by useAppearance) before the app
         has loaded, so a dark theme never flashes light; key: APPEARANCE_CACHE_KEY in
         src/lib/persistence.ts -->
    <script>
      ;(function () {
        var root = document.documentElement
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var theme = 'system'
        var lightStyle = 'light'
        var darkStyle = 'soft'
        var variables = {}
        try {
          var cache = JSON.parse(localStorage.getItem('calculator-appearance') || 'null')
          if (cache && typeof cache === 'object') {
            theme = cache.theme
            lightStyle = cache.lightStyle === 'pink' ? 'pink' : 'light'
            darkStyle = cache.darkStyle === 'bento' ? 'bento' : 'soft'
            variables = cache.variables || {}
          }
        } catch (error) {
          // no storage (private browsing): the device's light/dark look
        }
        var dark = theme === 'dark' || (theme !== 'light' && prefersDark)
        root.dataset.scheme = dark ? darkStyle : lightStyle
        for (var name in variables) {
          var value = variables[name]
          if (/^--[a-z-]+$/.test(name) && /^#[0-9a-f]{6}$/i.test(value)) {
            root.style.setProperty(name, value)
          }
        }
      })()
    </script>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- offer the account's app icon (cached by useAppearance) for Add to Home Screen, also before
         the app has loaded; same files as appIconFiles in src/features/appearance/appIcon.ts -->
    <script>
      ;(function () {
        var icon
        try {
          var cache = JSON.parse(localStorage.getItem('calculator-appearance') || 'null')
          icon = cache && cache.appIcon
        } catch (error) {
          // no storage (private browsing): the default icon
        }
        if (typeof icon !== 'string' || !/^[a-z]+$/.test(icon)) return
        var touchIcon = document.querySelector('link[rel="apple-touch-icon"]')
        var svgIcon = document.querySelector('link[rel="icon"][type="image/svg+xml"]')
        if (touchIcon)
          touchIcon.setAttribute('href', '/icons/' + icon + '/apple-touch-icon-180x180.png')
        if (svgIcon) svgIcon.setAttribute('href', '/icons/' + icon + '/icon.svg')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
